[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkeeper"
version = "0.1.2"
description = "Local-first inventory, replay, staging, and rollback for Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Jyoti Pravat Senapati"}
]
keywords = ["agent-skills", "ai-agents", "llm", "observability", "skillops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jyotipravatiitm/skillkeeper"
Documentation = "https://github.com/jyotipravatiitm/skillkeeper#readme"
Issues = "https://github.com/jyotipravatiitm/skillkeeper/issues"

[project.scripts]
skillkeeper = "skillkeeper.cli:main"

[tool.setuptools]
packages = ["skillkeeper"]
